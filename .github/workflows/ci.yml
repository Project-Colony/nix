name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Every system the flake declares, each on a native runner, so aarch64 is
    # built and smoke-tested rather than only evaluated.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Evaluation does not depend on the runner, so one leg is enough.
      - name: Check the flake for every system
        if: matrix.runner == 'ubuntu-latest'
        run: nix flake check --all-systems

      - name: Build every package
        run: |
          set -o pipefail
          system=$(nix eval --impure --raw --expr builtins.currentSystem)
          # Derived from the flake rather than hardcoded, so adding a package
          # does not also require editing this workflow.
          nix eval --json --apply builtins.attrNames ".#packages.${system}" \
            | jq -r '.[]' \
            | grep -vx default \
            | while read -r pkg; do
                echo "::group::nix build .#${pkg}"
                nix build --print-build-logs ".#${pkg}"
                echo "::endgroup::"
              done

      # Already built above, so this only points `result` at SphereCord.
      - run: nix build .#spherecord -o result

      - name: Smoke test the wrapper
        run: |
          test -x result/bin/spherecord
          test -f result/share/applications/gg.spherecord.app.desktop
          echo "--- desktop entry ---"
          cat result/share/applications/gg.spherecord.app.desktop

      # The desktop entry naming its icon and the icon actually existing are two
      # different facts, and upstream's template gets the second one wrong for
      # the AppImage. Assert they agree rather than eyeballing a file listing.
      - name: The declared icon must actually be installed
        run: |
          icon=$(sed -n 's/^Icon=//p' result/share/applications/gg.spherecord.app.desktop)
          echo "desktop entry asks for icon: ${icon}"
          found=$(find result/share/icons -type f -name "${icon}.png" | wc -l)
          echo "matching icon files installed: ${found}"
          test "${found}" -gt 0
          find result/share/icons -type f | sort

  # The updater is the one piece of trust-critical code here: it decides which
  # hashes get committed.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck scripts/update.sh
