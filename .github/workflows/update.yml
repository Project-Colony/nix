# A poller, not a pusher. Nothing in the app repos triggers this workflow: it
# reads their latest releases on a schedule and bumps whatever moved.
#
# Why this shape, rather than a job chained into each app's release workflow
# the way Colony pushes colony-bin to the AUR: GitHub suppresses workflow
# triggers for events created by the default GITHUB_TOKEN, which is how
# colony-bin sat at 0.1.4 across nine releases before that was noticed. A
# poller has no cross-repo trigger to suppress, needs no write token in ten
# other repositories, and picks up any release it missed on the next tick.
#
# It also builds what it bumped BEFORE pushing, for the same reason: a push
# made with GITHUB_TOKEN does not trigger ci.yml either, so a bump verified
# only by CI-on-push would never actually be verified.
#
# Two jobs, so the write token never meets Nix or anything downloaded:
#
# - `prepare` holds a read-only token. It runs update.sh (which downloads and
#   verifies release assets), installs Nix, optionally moves nixpkgs, checks
#   and builds every package, and hands sources.json and flake.lock on as an
#   artifact. A third-party installer action, the Nix daemon, the release
#   assets and every package build run here, where the token cannot push.
# - `publish` holds `contents: write` and does nothing but copy those two
#   files over a fresh checkout, refuse anything else, commit and push. It
#   never installs Nix and never runs code from the artifact.
#
# The hourly tick follows app releases. The weekly tick (and a manual run with
# `nixpkgs` ticked) also moves nixpkgs through `nix flake update`, through the
# same build-before-push gate, so the lock never ages unnoticed. It also keeps
# the repository active, so GitHub does not disable the schedule after 60 quiet
# days.
name: Update sources

on:
  schedule:
    - cron: "17 * * * *"
    # Keep in sync with BUMP_NIXPKGS below.
    - cron: "41 4 * * 1"
  workflow_dispatch:
    inputs:
      nixpkgs:
        description: Also move nixpkgs to the current nixos-unstable
        type: boolean
        default: false

permissions: {}

concurrency:
  group: update-sources

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUMP_NIXPKGS: ${{ github.event.schedule == '41 4 * * 1' || inputs.nixpkgs == true }}
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      summary: ${{ steps.diff.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refresh sources.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/update.sh

      # A run with no new release and no nixpkgs bump stops here in seconds,
      # without installing Nix.
      - name: Decide whether Nix is needed
        id: need
        run: |
          if [ "$BUMP_NIXPKGS" = true ] || ! git diff --quiet -- sources.json; then
            echo "nix=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: steps.need.outputs.nix == 'true'
        with:
          diagnostic-endpoint: ""

      - name: Move nixpkgs to the current nixos-unstable
        if: env.BUMP_NIXPKGS == 'true'
        run: nix flake update

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- sources.json flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "sources.json and flake.lock are already current."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- sources.json flake.lock
          # A package whose hashes moved under the same version (an asset
          # re-uploaded to the same release) still gets an entry, so the commit
          # subject is never a bare "chore:".
          summary=$(jq -rn \
            --argjson b "$(git show HEAD:sources.json)" \
            --argjson a "$(cat sources.json)" '
              [ $a
                | to_entries[]
                | ($b[.key] // {}) as $old
                | if .value.version != ($old.version // null) then
                    "\(.key) \($old.version // "new") -> \(.value.version)"
                  elif .value.hashes != $old.hashes then
                    "refresh \(.key) \(.value.version) hashes"
                  else empty end
              ] | join(", ")')
          old=$(git show HEAD:flake.lock | jq -r .nodes.nixpkgs.locked.rev)
          new=$(jq -r .nodes.nixpkgs.locked.rev flake.lock)
          if [ "$old" != "$new" ]; then
            summary="${summary:+${summary}, }nixpkgs ${old:0:7}..${new:0:7}"
          fi
          echo "summary=${summary:-refresh sources.json and flake.lock}" >> "$GITHUB_OUTPUT"

      - name: Build every package before trusting the bump
        if: steps.diff.outputs.changed == 'true'
        run: |
          nix flake check --all-systems
          # Derived from the flake rather than hardcoded, so adding a package
          # to sources.json does not also require editing this workflow.
          nix eval --json --apply builtins.attrNames .#packages.x86_64-linux \
            | jq -r '.[]' \
            | grep -vx default \
            | while read -r pkg; do
                echo "::group::nix build .#${pkg}"
                nix build --print-build-logs ".#${pkg}"
                echo "::endgroup::"
              done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: sources
          path: |
            sources.json
            flake.lock
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Same commit prepare built against (github.sha), so a main that moved in
      # between makes the push fail rather than land files built for another
      # tree. The next tick starts over from the new main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sources
          path: ${{ runner.temp }}/sources

      - name: Commit and push
        env:
          SUMMARY: ${{ needs.prepare.outputs.summary }}
        run: |
          cp "$RUNNER_TEMP/sources/sources.json" "$RUNNER_TEMP/sources/flake.lock" .
          if git status --porcelain | grep -vE '^ M (sources\.json|flake\.lock)$'; then
            echo "::error::Refusing to commit: files other than sources.json and flake.lock changed."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources.json flake.lock
          git commit -m "chore: ${SUMMARY}"
          git push
