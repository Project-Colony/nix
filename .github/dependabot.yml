# Keep the supply chain current: GitHub Actions.
#
# Copied from templates/dependabot.yml in Project-Colony-Resources, without
# its cargo entry: this repository has no Cargo.
#
# There is deliberately no `nix` entry. Dependabot supports that ecosystem
# (version updates of flake.lock inputs, public repositories), but
# .github/workflows/update.yml already keeps flake.lock current: any run that
# bumps no app and finds the pinned nixpkgs more than 7 days old runs
# `nix flake update`, builds every package on x86_64 and aarch64, and commits
# only once they all build, with no pull request left waiting for a merge.
# A Dependabot entry would be a second writer of flake.lock, and each of
# those commits would leave its open pull request stale. Resources records
# this as the nix-only exception in design/dependencies.md, "Automation".
#
# Dependabot opening a PR is not the rule being followed; merging it is. See
# design/dependencies.md: everything is on its latest release, always.
version: 2
updates:
  # A stale action is the same problem as a stale crate, with more privileges.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The shared signing workflow stays at the organisation pin, which moves
    # for every program at once: design/releases.md in
    # Project-Colony-Resources, "The pin". A Dependabot PR would move one
    # repository alone. Dependabot names that dependency after the workflow
    # path (Project-Colony/Project-Colony-Resources/.github/workflows/...), so
    # the rule needs the trailing wildcard to match it.
    ignore:
      - dependency-name: "Project-Colony/Project-Colony-Resources*"
    groups:
      actions:
        patterns: ["*"]
